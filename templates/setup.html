<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><title>Настройка CRM</title></head>
<body class="authbody"><form class="authcard" method="post"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><div class="logo big">DR</div><div class="eyebrow">ПЕРВЫЙ ЗАПУСК</div><h1>Создать администратора</h1><p class="muted">Этот аккаунт будет управлять CRM и доступом команды.</p>{% for msg in get_flashed_messages() %}<div class="flash">{{ msg }}</div>{% endfor %}<label>Логин<input name="username" required minlength="3"></label><label>Пароль (минимум 12 символов)<input type="password" name="password" required minlength="12"></label><button>Создать аккаунт</button></form></body></html>
