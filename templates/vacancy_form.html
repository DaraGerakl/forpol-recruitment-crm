{% extends "base.html" %}{% set heading='Новая вакансия' %}{% block content %}<form class="formcard" method="post"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><h2>Информация о вакансии</h2><div class="formgrid"><label>Название вакансии *<input name="title" required></label><label>Город<input name="city"></label><label>Ставка<input name="rate" placeholder="Например, 31,50 zł brutto/h"></label><label>График<input name="schedule" placeholder="День / ночь, 8–12 часов"></label><label>Адрес склада<input name="warehouse_address" placeholder="Улица, номер, индекс"></label><label>Жильё<input name="housing" placeholder="Бесплатно / 950 zł"></label><label>Доезд<input name="transport" placeholder="Бесплатный / 100 zł / самостоятельно"></label><label>Статус<select name="status"><option>Активна</option><option>Приостановлена</option><option>Закрыта</option></select></label></div><div class="actions"><a class="button secondary" href="/vacancies">Отмена</a><button>Сохранить вакансию</button></div></form>{% endblock %}
